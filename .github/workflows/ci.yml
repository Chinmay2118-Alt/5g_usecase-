name: 5G Teleoperation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & 5G Link-Loss Trials (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (113 Tests)
        run: |
          pytest -v

      - name: Test Server Startup & Real-time Link-Loss Trials
        run: |
          python -m server.main --http 8080 &
          SRV_PID=$!
          sleep 4
          curl -fsS http://localhost:8080/api/health
          python tools/fake_operator.py --url http://localhost:8080 --trials 5
          kill $SRV_PID

  docker-build:
    name: Docker Multi-Stage Container Build & Healthcheck
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t 5g-remote-hands:test .

      - name: Run container and verify healthcheck
        run: |
          docker run -d --name 5g-test -p 8443:8443 -e SERVER_IP=127.0.0.1 5g-remote-hands:test
          sleep 6
          docker ps
          curl -kfsS https://127.0.0.1:8443/api/health
          docker logs 5g-test
          docker stop 5g-test
