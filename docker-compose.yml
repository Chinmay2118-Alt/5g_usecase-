version: '3.8'

# =============================================================================
# 5G Remote Hands — Docker Compose Orchestration
# Designed for 5G Core (UPF) / MEC Edge Nodes
# =============================================================================

services:
  remote-hands:
    build:
      context: .
      dockerfile: Dockerfile
    image: 5g-remote-hands:latest
    container_name: 5g-remote-hands
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Network Configuration:
    # Default: Bridge network with port forwarding.
    # Production 5G MEC Optimization:
    # For sub-millisecond latency on private 5G N6/UPF interfaces, uncomment:
    # network_mode: host
    # and comment out the 'ports:' section below.
    # -------------------------------------------------------------------------
    ports:
      - "${SERVER_PORT:-8443}:8443"
      - "${HTTP_PORT:-8080}:8080"

    environment:
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8443}
      - HTTP_PORT=${HTTP_PORT:-}
      - SCENARIO=${SCENARIO:-flood}
      - SERVER_IP=${SERVER_IP:-}
      - EXTRA_IPS=${EXTRA_IPS:-}
      - AUTO_GEN_CERT=${AUTO_GEN_CERT:-true}

    # Grant NET_ADMIN capability for low-latency kernel network tuning
    cap_add:
      - NET_ADMIN

    # Persistent host mounts for TLS certificates and mission/telemetry CSV logs
    volumes:
      - ./certs:/app/certs
      - ./logs:/app/logs

    # Built-in health monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8443/api/health || curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

    # Container log rotation to protect edge server disk space
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

